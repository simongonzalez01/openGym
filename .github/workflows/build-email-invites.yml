name: Build e-mail invitation images

on:
  push:
    branches: [codex/email-invites]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: api
            context: ./api
            file: ./api/Dockerfile
          - image: web
            context: .
            file: ./web/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=1.3.9-email-invites
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            APP_BUILD=email-invites-${{ github.run_number }}
          push: true
          tags: ghcr.io/simongonzalez01/opengym-${{ matrix.image }}:email-invites
          cache-from: type=gha,scope=email-invites-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=email-invites-${{ matrix.image }}
